plugins {
    id 'com.android.application'
}

android {
    namespace 'tv.dashboard.home'
    compileSdk 34

    defaultConfig {
        applicationId 'tv.dashboard.home'
        minSdk 22
        // Fire OS 7 e' Android 9 (API 28): lo stesso target evita le restrizioni
        // di visibilita' dei pacchetti introdotte con Android 11.
        targetSdk 28
        versionCode 1
        versionName '1.0'
    }

    // Chiave fissa inclusa nel progetto: gli aggiornamenti si installano sopra la versione
    // precedente senza disinstallare l'app. E' un'app personale, non per lo store.
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
