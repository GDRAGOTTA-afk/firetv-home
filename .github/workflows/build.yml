name: Compila APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compila
        run: |
          SETTINGS=$(find . -name settings.gradle -not -path './.git/*' | head -n 1)
          if [ -z "$SETTINGS" ]; then
            echo "ERRORE: non trovo il file settings.gradle nel repository. File presenti:"
            find . -not -path './.git/*' -type f | head -n 60
            exit 1
          fi
          DIR=$(dirname "$SETTINGS")
          echo "Progetto trovato in: $DIR"
          cd "$DIR"
          gradle assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/home-tv.apk"

      - name: Pubblica l'APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build
          name: Home TV (ultima versione)
          body: APK pronto da installare sulla Fire TV.
          files: home-tv.apk
